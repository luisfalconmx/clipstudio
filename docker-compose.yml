services:
  dev:
    build:
      context: ./docker
    image: reelcut-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/app/src-tauri/target
      - xwin_cache:/xwin-cache
    ports:
      - "1420:1420"

volumes:
  node_modules:
  cargo_registry:
  cargo_target:
  xwin_cache:
